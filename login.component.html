<mat-card
  style="
    background-color: white;
    width: 500px;
    margin: 0 auto;  /* centers horizontally */
  ">  <mat-card-header>
    <mat-card-title style="background-color: white;">Login</mat-card-title>
  </mat-card-header>

  <mat-card-content style="background-color: white;">
    <form (ngSubmit)="onSubmit()">
      <mat-form-field>
        <input matInput placeholder="Email" [(ngModel)]="email" name="email" required>
      </mat-form-field>

      <mat-form-field>
        <input matInput type="password" placeholder="Password" [(ngModel)]="password" name="password" required>
      </mat-form-field>

      <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button mat-raised-button color="primary" type="submit">Login</button>
              <div class="register-prompt">
          Don't have an account?
          <a mat-button color="primary" routerLink="/register">Register here</a>
        </div>
    </form>
  </mat-card-content>
</mat-card>
