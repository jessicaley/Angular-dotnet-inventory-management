<mat-card style="background-color: white; width: 500px; margin: 0 auto;">
  <mat-card-header>
    <mat-card-title>Register</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <mat-form-field>
        <input matInput placeholder="Email Address"
               formControlName="emailaddress"
               required>
        <mat-error *ngIf="registerForm.get('emailaddress')?.hasError('required')">
          Email is required
        </mat-error>
        <mat-error *ngIf="registerForm.get('emailaddress')?.hasError('email')">
          Invalid email format
        </mat-error>
      </mat-form-field>

      <mat-form-field>
        <input matInput type="password"
               placeholder="Password"
               formControlName="password"
               required>
        <mat-error *ngIf="registerForm.get('password')?.hasError('required')">
          Password is required
        </mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary"
              type="submit"
              [disabled]="!registerForm.valid">
        Register
      </button>

      <div class="login-prompt">
        Already have an account?
        <a mat-button color="primary" routerLink="/login">Login here</a>
      </div>
    </form>
  </mat-card-content>
</mat-card>
