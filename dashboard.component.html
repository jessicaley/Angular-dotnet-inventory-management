<div class="dashboard-container">
  <h1 class="mat-h1">Product Dashboard</h1>

<mat-grid-list cols="2" rowHeight="400px"> <!-- Fixed height -->
  <mat-grid-tile>
    <div class="chart-container">
      <canvas id="brandChart"></canvas> <!-- ID must match -->
    </div>
  </mat-grid-tile>
  <mat-grid-tile>
    <div class="chart-container">
      <canvas id="typeChart"></canvas> <!-- ID must match -->
    </div>
  </mat-grid-tile>
</mat-grid-list>

  <!-- Existing table section remains unchanged -->
</div>

  <div class="table-section" style="background-color: plum; color: white;">
    <h2 class="mat-h2">Top 10 Most Expensive Products</h2>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8"style="background-color: plum; color: white;">
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Product Name</th>
        <td mat-cell *matCellDef="let product">{{product.name}}</td>
      </ng-container>

      <!-- Price Column -->
      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Price</th>
        <td mat-cell *matCellDef="let product">
          {{product.price | currency:'ZAR':'symbol':'1.2-2'}}
        </td>
      </ng-container>

      <!-- Brand Column -->
      <ng-container matColumnDef="brand">
        <th mat-header-cell *matHeaderCellDef>Brand</th>
        <td mat-cell *matCellDef="let product">{{product.brand}}</td>
      </ng-container>

      <!-- Type Column -->
      <ng-container matColumnDef="productType">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let product">{{product.productType}}</td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let product">{{product.description}}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]"style="background-color: plum; color: white;"></mat-paginator>
  </div>
